<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge-1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="left">
            <img src="gamer-sign-up-form-main/assets/images/logo.svg" alt="Logo" class="logo">

            <h1 class="title"><span class="slash">//</span>JOIN THE NEXUS</h1>
            <p class="subtitle">INITIALIZE YOUR NEONCORE IDENTITY</p>

            <p class="progress-details">
                OPERATOR ID <span class="progress-value">0/5 READY</span>
            </p>
            <h2 class="h2">UNASSIGNED</h2>

            <ul class="list">
                <li>
                    <span>CallSign</span>
                    <span>Pending</span>
                </li>
                <li>
                    <span>Email</span>
                    <span>Pending</span>
                </li>
                <li>
                    <span>Password</span>
                    <span>Pending</span>
                </li>
                <li>
                    <span>Confirm</span>
                    <span>Pending</span>
                </li>
                <li>
                    <span>Terms</span>
                    <span>Pending</span>
                </li>
            </ul>
        </section>
        <section class="right">
            <div class="form-container">
                <form class="registration-form">
                    <p class="one">NEW OPERATOR</p>
                    <p class="two">ALL FIELDS REQUIRED</p>
                    <label for="callsign">CallSign</label><input type="text" id="callsign" name="callsign" placeholder="e. g. Vortex_07">
                    <label for="email">Email</label><input type="email" id="email" name="email" placeholder="you@gmail.com">
                    <label for="password">Password</label><input type="password" id="password" name="password">
                    <label for="confirm-password">Confirm Password</label><input type="password" id="confirm-password" name="confirm-password">
                    <input type="checkbox" id="terms">
                    <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                    <button type="submit">INITIALIZE ACCOUNT</button>
                    <p class="login-link">Already have an account? <a href="#">Log in</a></p>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
